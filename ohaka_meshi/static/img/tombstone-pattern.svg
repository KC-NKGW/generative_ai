      <path d="M14 84 L14 34 Q14 4 45 4 Q76 4 76 34 L76 84 Z" fill="#F4B6C6" stroke="#5B4636" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="32" cy="42" r="4" fill="#5B4636"/>
      <circle cx="58" cy="42" r="4" fill="#5B4636"/>
      <path d="M33 56 Q45 65 57 56" stroke="#5B4636" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M30 24 Q45 14 60 24" stroke="#5B4636" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5"/>
    </g>
    <!-- flower -->
    <g transform="translate(180,60)">
      <line x1="0" y1="10" x2="0" y2="55" stroke="#8FBF8F" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-9" cy="-2" r="8" fill="#F4A6BE"/>
      <circle cx="9" cy="-2" r="8" fill="#F4A6BE"/>
