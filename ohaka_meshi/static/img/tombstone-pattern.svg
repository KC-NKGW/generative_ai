    <g transform="translate(70,190)">
      <path d="M0 14 Q0 34 22 34 Q44 34 44 14 Z" fill="#F7F5EF" stroke="#5B4636" stroke-width="3"/>
      <ellipse cx="22" cy="14" rx="22" ry="7" fill="#FFFFFF" stroke="#5B4636" stroke-width="3"/>
      <path d="M14 -2 Q12 -12 18 -18" stroke="#C9C4B6" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>
      <path d="M26 -2 Q28 -14 22 -20" stroke="#C9C4B6" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    </g>
    <!-- sparkles -->
