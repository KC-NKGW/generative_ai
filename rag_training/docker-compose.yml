services:
  qdrant:
    image: qdrant/qdrant:v1.9.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ingest:
    build: ./services/ingest
    profiles: ["tools"]
    depends_on:
      - qdrant
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      NOTES_DIR: /data/notes
    volumes:
      - ./data/notes:/data/notes:ro

  api:
    build: ./services/api
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - ollama
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}

volumes:
  qdrant_data:
  ollama_data:
